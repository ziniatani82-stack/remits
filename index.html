  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 95vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: linear-gradient(135deg, #eef4fb, #f8f5fc);
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1b1b1b;
    }
    .card {
      width: min(100%, 420px);
      background: #fff;
      padding: 26px 30px;
      border: 1px solid #e5e5e5;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }
    /* EDIT THE PAGE BACKGROUND HERE.
       Replace background.jpg with your image filename or an image URL.
       If using a filename, keep the image in the same folder as this HTML file.
    */
    body {
      background:
        linear-gradient(135deg, rgba(238,244,251,.35), rgba(248,245,252,.35)),
        url("background.jpg") center / cover no-repeat fixed;
    }

    .demo-tag {
      display: inline-block;
      margin-bottom: 24px;
      padding: 20px 20px;
      border-radius: 4px;
      background: #fff4ce;
      color: #654d00;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .mark {
      width: 32px;
      height: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      margin-bottom: 12px;
      transform: perspective(60px) rotateY(-4deg);
    }
    .mark span { display: block; }
    .mark span:nth-child(1) { background: #f35325; }
    .mark span:nth-child(2) { background: #81bc06; }
    .mark span:nth-child(3) { background: #05a6f0; }
    .mark span:nth-child(4) { background: #ffba08; }
    h1 { font-size: 28px; font-weight: 600; margin: 12px 0 8px; }
    .intro { color: #555; line-height: 1.5; margin: 0 0 26px; }
    label { display: block; font-size: 14px; margin: 18px 0 7px; }
    input {
      width: 95%;
      border: 0;
      border-bottom: 1px solid #777;
      padding: 10px 2px;
      font: inherit;
      font-size: 16px;
      outline: none;
      background: transparent;
    }
    input:focus { border-bottom: 2px solid #2563a6; }
    .note {
      margin-top: 22px;
      padding: 12px;
      background: #f4f7fb;
      border-left: 3px solid #5b83b5;
      color: #454545;
      font-size: 13px;
      line-height: 1.45;
    }
    button {
      display: block;
      margin: 32px 0 0 auto;
      border: 0;
      background: #2563a6;
      color: white;
      padding: 12px 34px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #194f87; }
    .status { min-height: 20px; margin-top: 16px; font-size: 13px; color: #28613a; }
    @media (max-width: 520px) { .card { padding: 20px 18px; } }
  </style>
